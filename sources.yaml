sources:
  yahoo_finance:
    role: Primary historical OHLC and macro series
    access: yfinance public download interface
    limitations: May be delayed, rate-limited, unavailable, or revised; not a broker execution quote
  stooq:
    role: Daily OHLC fallback
    access: Public CSV endpoint
    limitations: Symbol coverage and freshness vary; intraday support is not assumed
  tradingview_widget:
    role: Interactive chart and visible market calendar
    access: Official embedded Advanced Real-Time Chart widget
    limitations: Uses TradingView's selected market feed, which can differ from Bolorox analysis data
  cftc:
    role: Weekly positioning context
    access: Public CFTC Socrata JSON endpoint
    limitations: Weekly futures positioning; not a real-time sentiment measure
  calendar_json:
    role: Programmatic upcoming events
    configuration: Set BOLOROX_CALENDAR_URL to a public JSON feed
    limitations: No feed is configured by default; absence of data is not confirmation of no event risk
  news_rss:
    role: Headlines
    configuration: Set BOLOROX_NEWS_FEEDS to comma-separated public RSS or Atom URLs
    limitations: Headlines are source-dependent and are not scored for sentiment
