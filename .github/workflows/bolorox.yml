name: BOLOROX Daily Run

on:
  schedule:
    # 07:00 UTC on weekdays
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol to analyze (blank = all default symbols)'
        required: false
        default: ''
      command:
        description: 'Command (RUN or STATUS)'
        required: false
        default: 'RUN'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run BOLOROX
        env:
          BOLOROX_COMMAND: ${{ github.event.inputs.command || 'RUN' }}
          BOLOROX_SYMBOL: ${{ github.event.inputs.symbol || '' }}
        run: |
          if [ "$BOLOROX_COMMAND" = "STATUS" ]; then
            python main.py STATUS
          elif [ -n "$BOLOROX_SYMBOL" ]; then
            python main.py RUN "$BOLOROX_SYMBOL"
          else
            python main.py RUN ALL
          fi

      - name: Upload reports and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolorox-reports-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
